name: Paper Trading

on:
  schedule:
    # ~21:15 UTC, just after the live-signals run.
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}

# Needed so the job can commit the updated ledger back to the branch.
permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.run_paper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
      - name: Commit updated paper ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot/paper_state.json
          git commit -m "Update paper trading ledger [skip ci]" || echo "no changes"
          git push
