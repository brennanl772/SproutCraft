name: ORB Live Monitor

on:
  schedule:
    # 13:40 UTC = 09:40 ET during US summer (EDT). In winter (EST) the open is
    # an hour later — change to "40 14 * * 1-5". The job then watches until
    # ORB_MONITOR_UNTIL (ET) for the first breakout.
    - cron: "40 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  orb:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.run_orb
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          ORB_RANGE_MINUTES: ${{ vars.ORB_RANGE_MINUTES }}
          ORB_DIRECTION: ${{ vars.ORB_DIRECTION }}
          ORB_TARGET_R: ${{ vars.ORB_TARGET_R }}
          FIXED_STAKE: ${{ vars.FIXED_STAKE }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
