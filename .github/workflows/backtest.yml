name: Backtest

on:
  workflow_dispatch: {}

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run backtest and publish to summary
        run: python -m bot.backtest | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          WATCHLIST: ${{ vars.WATCHLIST }}
          BACKTEST_PERIOD: ${{ vars.BACKTEST_PERIOD }}
          ACCOUNT_SIZE: ${{ vars.ACCOUNT_SIZE }}
          RISK_PER_TRADE: ${{ vars.RISK_PER_TRADE }}
